# Publish artifacts/ to GitHub Pages whenever a run is pushed to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The board is then served at https://masenf.github.io/rx-review-queue/
name: Publish board
on:
  push:
    branches: [main]
    paths: ["artifacts/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts
      - id: deployment
        uses: actions/deploy-pages@v4
